<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashzo · Flow</title>
<style>
  :root {
    --bg: #0d0e13; --card: #14161d; --line: #262a36; --ink: #eceef4; --dim: #8b90a0; --iris: #818cf8; --volt: #a3e635;
    --ok: #34d399; --bad: #fb7185; --track: #232634; --chip: #1b1e28; --shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --card: #f7f8fb; --line: #e3e6ee; --ink: #12141b; --dim: #687083; --iris: #4f46e5; --volt: #16a34a;
    --ok: #059669; --bad: #e11d48; --track: #e6e8f0; --chip: #eef0f6; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
  .logo { width: 18px; height: 18px; flex: none; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .chip { font: 600 10px ui-monospace, "JetBrains Mono", Consolas, monospace; letter-spacing: .04em; text-transform: uppercase;
          padding: 2px 7px; border-radius: 6px; display: inline-flex; gap: 5px; align-items: center; background: var(--chip); color: var(--dim); white-space: nowrap; }
  .chip.active { color: var(--iris); } .chip.ready { color: var(--ok); } .chip.error { color: var(--bad); }
  .time { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); white-space: nowrap; }
  .track { height: 3px; background: var(--track); margin: 0 14px; border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; width: 0; background: linear-gradient(90deg, #6366f1, #a855f7, #34d399); transition: width .6s ease; }
  .media { position: relative; margin: 12px 14px 0; border-radius: 12px; background: #000; aspect-ratio: 16 / 9; overflow: hidden;
           display: grid; place-items: center; color: #9aa0b2; }
  .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .media .msg { font: 12px ui-monospace, Consolas, monospace; text-align: center; padding: 0 18px; display: grid; gap: 10px; justify-items: center; }
  .ring { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(129,140,248,.25); border-top-color: var(--iris);
          animation: spin .75s linear infinite; transform-origin: 50% 50%; }
  .ring.sm { width: 10px; height: 10px; border-width: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .body { padding: 12px 14px 14px; display: grid; gap: 9px; }
  .prompt { color: var(--ink); opacity: .9; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; margin: 0; }
  .prompt.open { -webkit-line-clamp: unset; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 11px ui-monospace, Consolas, monospace; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--dim); }
  .refs { display: flex; gap: 8px; }
  .refs figure { margin: 0; display: grid; gap: 3px; justify-items: center; }
  .refs img, .refs .noimg { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); background: var(--chip); }
  .refs figcaption { font: 10px ui-monospace, Consolas, monospace; color: var(--dim); }
  .replies { display: grid; gap: 4px; }
  .reply { border-left: 2px solid var(--iris); padding-left: 8px; color: var(--dim); font-size: 12.5px; }
  .actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .file { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  button { font: 500 12px system-ui, sans-serif; border-radius: 999px; padding: 5px 11px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--iris); color: var(--iris); }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  button.primary { background: var(--iris); border-color: var(--iris); color: #fff; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 2s; } .bar { transition: none; } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="b" x1="24" y1="20" x2="96" y2="92" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#38bdf8"/><stop offset=".4" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M57 16C53.5 16 49.5 20.5 45.5 29L25 73.5C21 81.5 24.5 90 33.5 90c6 0 11-4.5 15-11.5l7-14c1-2 4-2 5 0l7 14c4 7 9 11.5 15 11.5 9 0 12.5-8.5 8.5-16.5L70.5 29C66.5 20.5 62.5 16 57 16Z" fill="url(#b)"/><path d="M54.5 42c0-2 2.3-3.2 4-2.2l14 8.7c1.7 1 1.7 3.7 0 4.7l-14 8.7c-1.7 1-4-.2-4-2.2Z" fill="#fff"/></svg>
    <span class="title" id="title">Google Flow</span>
    <span class="chip active" id="chip"><span class="ring sm"></span>starting</span>
    <span class="time" id="time"></span>
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="media" id="media"><div class="msg"><span class="ring"></span><span id="mediaMsg">Sending to Google Flow…</span></div></div>
  <div class="body">
    <p class="prompt" id="prompt" title="Click to expand"></p>
    <div class="tags" id="tags"></div>
    <div class="refs hidden" id="refs"></div>
    <div class="replies hidden" id="replies"></div>
    <div class="actions">
      <span class="file" id="file"></span>
      <span style="display:flex;gap:6px">
        <button type="button" class="danger hidden" id="cancelBtn">Cancel</button>
        <button type="button" id="dashBtn">Open dashboard</button>
      </span>
    </div>
  </div>
</div>
<script>
'use strict';
const ACTIVE = ['queued', 'initializing', 'connecting', 'submitting', 'waiting', 'rendering', 'downloading'];
const LABEL = { queued: 'queued', connecting: 'opening flow', submitting: 'sending', waiting: 'waiting', rendering: 'rendering',
  downloading: 'saving', ready: 'ready', error: 'stopped', cancelled: 'cancelled', idle: 'idle' };
const $ = (id) => document.getElementById(id);
let nextId = 1;
const pending = new Map();
let jobId = null, job = null, pollTimer = null, dashboardUrl = 'http://localhost:8000/', loadedVideo = null;

function send(msg) { window.parent.postMessage(msg, '*'); }
function rpc(method, params) {
  const id = ++nextId;
  send({ jsonrpc: '2.0', id, method, params });
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error('timeout')); } }, 60000);
  });
}
function payload(result) {
  if (!result) return null;
  if (result.structuredContent) return result.structuredContent.result ?? result.structuredContent;
  const t = (result.content || []).find((c) => c.type === 'text');
  if (!t) return null;
  try { return JSON.parse(t.text); } catch { return null; }
}
async function callTool(name, args) { return payload(await rpc('tools/call', { name, arguments: args || {} })); }

function fmt(ms) { if (!ms || ms < 0) return ''; const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function applyTheme(ctx) { if (ctx && ctx.theme) document.documentElement.dataset.theme = ctx.theme; }

function render() {
  if (!job) return;
  const s = (job.state || '').toLowerCase();
  const active = ACTIVE.includes(s);
  $('title').textContent = job.title || 'Google Flow';
  const chip = $('chip');
  chip.className = 'chip ' + (active ? 'active' : s === 'ready' ? 'ready' : s === 'error' ? 'error' : '');
  chip.innerHTML = (active ? '<span class="ring sm"></span>' : '') + (LABEL[s] || s || '…');
  $('bar').style.width = Math.max(active ? 4 : 0, Math.min(100, job.progress || (s === 'ready' ? 100 : 0))) + '%';
  if (job.prompt) $('prompt').textContent = job.prompt;
  const tags = [job.model_label, job.duration === '30s_ad' ? '30s · 4 scenes' : job.duration && job.duration + 's', job.aspect_ratio, job.quality].filter(Boolean);
  $('tags').innerHTML = tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('');
  const refs = job.references || [];
  $('refs').classList.toggle('hidden', !refs.length);
  $('refs').innerHTML = refs.map((r) => `<figure>${r.thumb ? `<img src="${r.thumb}" alt="">` : '<div class="noimg"></div>'}<figcaption>${esc(r.role)}</figcaption></figure>`).join('');
  const chat = (job.chat || []).slice(-3);
  $('replies').classList.toggle('hidden', !chat.length);
  $('replies').innerHTML = chat.map((c) => `<div class="reply">${esc(c)}</div>`).join('');
  $('cancelBtn').classList.toggle('hidden', !active);
  const files = job.files || [];
  $('file').textContent = files.length ? `${files[0].name} · ${files[0].size_mb} MB` : (job.message || '');
  $('file').title = files.length ? files[0].path || '' : '';
  if (job.dashboard_url) dashboardUrl = job.dashboard_url;
  if (files.length) showVideo(files[0]);
  else if (!loadedVideo) {
    $('media').innerHTML = active
      ? `<div class="msg"><span class="ring"></span><span>${esc(job.message || 'Working…')}</span></div>`
      : `<div class="msg" style="color:${s === 'error' ? 'var(--bad)' : 'inherit'}">${esc(job.message || '')}</div>`;
  }
  tick();
  sizeChanged();
}
function tick() {
  if (!job) return;
  const active = ACTIVE.includes((job.state || '').toLowerCase());
  $('time').textContent = active && job.started_at ? fmt(Date.now() - job.started_at) : (job.finished_at && job.started_at ? fmt(job.finished_at - job.started_at) : '');
}
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function showVideo(f) {
  if (loadedVideo === f.path) return;
  loadedVideo = f.path;
  const box = $('media');
  box.innerHTML = '<div class="msg"><span class="ring"></span><span>Loading the video…</span></div>';
  // 1) straight from the Ashzo MCP dashboard, when this chat allows it
  if (f.url) {
    const ok = await new Promise((resolve) => {
      const v = document.createElement('video');
      v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.muted = true;
      const done = (r) => { clearTimeout(t); resolve(r ? v : null); };
      const t = setTimeout(() => done(false), 4000);
      v.onloadedmetadata = () => done(true);
      v.onerror = () => done(false);
      v.src = f.url;
    });
    if (ok) { box.innerHTML = ''; box.appendChild(ok); sizeChanged(); return; }
  }
  // 2) through Ashzo MCP itself, in pieces (works offline and without the dashboard)
  try {
    let parts = [], total = 1;
    for (let i = 0; i < total; i++) {
      const r = await callTool('flow_card_video_part', { path: f.path, index: i });
      if (!r || r.error) throw new Error((r && r.error) || 'no data');
      total = r.total; parts.push(r.data);
      box.querySelector('span:last-child').textContent = `Loading the video… ${Math.round(((i + 1) / total) * 100)}%`;
    }
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'metadata';
    v.src = 'data:video/mp4;base64,' + parts.join('');
    box.innerHTML = ''; box.appendChild(v); sizeChanged();
  } catch (e) {
    box.innerHTML = `<div class="msg">The video is saved on your computer:<br>${esc(f.name)}</div>`;
  }
}

async function poll() {
  if (!jobId) return;
  try {
    const r = await callTool('flow_card_status', { job_id: jobId });
    if (r && !r.error) { job = r; render(); }
  } catch { /* host busy; try again next time */ }
  const active = job && ACTIVE.includes((job.state || '').toLowerCase());
  clearTimeout(pollTimer);
  if (active || !job) pollTimer = setTimeout(poll, 2500);
}

function onToolResult(params) {
  const data = payload(params) || {};
  const j = data.job || data;
  if (j && (j.id || j.job_id)) {
    jobId = j.id || j.job_id;
    job = Object.assign({}, job || {}, j);
    render();
    poll();
  } else if (data.message) {
    job = Object.assign({}, job || {}, { state: data.status === 'busy' ? 'error' : 'error', message: data.message });
    render();
  }
}

let lastHeight = 0;
function sizeChanged() {
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  if (h !== lastHeight) { lastHeight = h; send({ jsonrpc: '2.0', method: 'ui/notifications/size-changed', params: { width: document.documentElement.scrollWidth, height: h } }); }
}

window.addEventListener('message', (event) => {
  if (event.source !== window.parent) return;
  const m = event.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.id !== undefined && pending.has(m.id) && !m.method) {
    const p = pending.get(m.id); pending.delete(m.id);
    if (m.error) p.reject(new Error(m.error.message || 'error')); else p.resolve(m.result);
    return;
  }
  switch (m.method) {
    case 'ui/notifications/tool-input': {
      const a = (m.params && m.params.arguments) || {};
      job = Object.assign({ state: 'queued', message: 'Sending to Google Flow…' }, job || {}, {
        title: a.slug || (job && job.title), prompt: a.prompt, duration: a.duration, aspect_ratio: a.aspect_ratio, quality: a.download_quality,
      });
      render();
      break;
    }
    case 'ui/notifications/tool-result': onToolResult(m.params); break;
    case 'ui/notifications/host-context-changed': applyTheme(m.params); break;
    default:
      if (m.id !== undefined && m.method) send({ jsonrpc: '2.0', id: m.id, result: {} });  // e.g. ui/resource-teardown
  }
});

$('prompt').addEventListener('click', () => { $('prompt').classList.toggle('open'); sizeChanged(); });
$('dashBtn').addEventListener('click', () => { rpc('ui/open-link', { url: dashboardUrl }).catch(() => {}); });
$('cancelBtn').addEventListener('click', async () => { $('cancelBtn').disabled = true; try { await callTool('flow_card_cancel', {}); } finally { $('cancelBtn').disabled = false; poll(); } });
if (window.ResizeObserver) new ResizeObserver(sizeChanged).observe(document.body);
setInterval(tick, 1000);

// handshake
send({ jsonrpc: '2.0', id: 1, method: 'ui/initialize', params: {
  protocolVersion: '2026-01-26', appInfo: { name: 'ashzo-flow-card', version: '1.0.0' }, clientInfo: { name: 'ashzo-flow-card', version: '1.0.0' },
  appCapabilities: { availableDisplayModes: ['inline'] } } });
pending.set(1, { resolve: (res) => { applyTheme(res && res.hostContext); send({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }); sizeChanged(); }, reject: () => {} });
</script>
</body>
</html>
